name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo ">>> [1/2] Kiểm tra sự tồn tại của 3 file: index.html, style.css, script.js"
          missing_files=0
          for file in index.html style.css script.js; do
            if [ -f "$file" ]; then
              echo "  [OK] Đã tìm thấy: $file"
            else
              echo "  [FAIL] Không tìm thấy file: $file"
              missing_files=$((missing_files + 1))
            fi
          done

          if [ $missing_files -ne 0 ]; then
            echo "::error::Thất bại: Thiếu $missing_files file bắt buộc!"
            exit 1
          fi

      - name: Check <title> tag in index.html
        run: |
          echo ">>> [2/2] Kiểm tra thẻ <title> trong file index.html"
          if grep -qi "<title>" index.html; then
            echo "  [OK] Thẻ <title> tồn tại hợp lệ."
          else
            echo "::error::Thất bại: Không tìm thấy thẻ <title> trong index.html!"
            exit 1
          fi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

